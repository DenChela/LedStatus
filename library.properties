sentence=Non-blocking RGB LED status indicator: solid, blinking and rainbow modes.
paragraph=A lightweight library for driving a common-cathode RGB LED as a game status indicator. Keeps a mirror of the pin state, all writes go through a single setColor() entry point. Blink and rainbow periods are configurable per instance via setters. Non-blocking handle() is designed to be called from loop(). Works on any Arduino core that provides analogWrite (ESP8266, ESP32 core 2.x+, AVR, and others).
